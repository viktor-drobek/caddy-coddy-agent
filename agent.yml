# Caddy Coddy Agent Configuration
# This file tells the Coddy agent how to work with the caddy-coddy infrastructure.

name: caddy-coddy-agent
description: Agent for managing caddy-coddy proxy stack (Caddy, Keycloak, oauth2-proxy)
version: 0.1.0

# Points to the parent caddy-coddy repo (relative when used as submodule)
workspace: ../..

# Skills this agent exposes
skills:
  - rpa-init
  - rpa-gen-rules

# Default commands the agent can run
commands:
  validate: "./scripts/validate.sh {{workspace}}"
  deploy: "./scripts/deploy.sh {{workspace}}"
  smoke: "./scripts/smoke.sh {{workspace}}"
  health: "./scripts/health-check.sh {{workspace}}"

# Backend connectivity
backends:
  local:
    host: ml
    ip: 192.168.135.12
  superset:
    host: superset
    ip: 192.168.135.10

# Validation patterns (used by rpa-gen-rules)
validation:
  - name: "bash-syntax"
    command: "bash -n %f"
    glob: "*.sh"
  - name: "json"
    command: "jq . %f > /dev/null"
    glob: "*.json"
  - name: "docker-compose"
    command: "docker compose -f %f config -q"
    glob: "docker-compose.yml"
  - name: "caddyfile"
    command: "caddy validate --adapter caddyfile --config %f"
    glob: "Caddyfile"

# Workflows available
workflows:
  - deploy
  - health-check
