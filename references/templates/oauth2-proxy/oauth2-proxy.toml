# oauth2-proxy — OIDC client for Keycloak realm "coddy", used by Caddy's
# forward_auth (GET /oauth2/auth) and for the browser login flow.
#
# Set via environment in docker-compose.yml (from .env):
#   OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET,
#   OAUTH2_PROXY_OIDC_ISSUER_URL, OAUTH2_PROXY_LOGIN_URL,
#   OAUTH2_PROXY_REDIRECT_URL, OAUTH2_PROXY_WHITELIST_DOMAINS

provider = "keycloak-oidc"
provider_display_name = "Keycloak"
client_id = "coddy-web"
scope = "openid profile email"
code_challenge_method = "S256"

# Discovery is skipped so oauth2-proxy can start before Caddy and never needs
# to reach its own public hostname: the browser-facing login_url is public
# (env), the back-channel endpoints go straight to the keycloak container.
# Tokens still carry the public issuer (KC_HOSTNAME), which is what is verified.
skip_oidc_discovery = true
redeem_url    = "http://keycloak:8080/auth/realms/coddy/protocol/openid-connect/token"
oidc_jwks_url = "http://keycloak:8080/auth/realms/coddy/protocol/openid-connect/certs"
profile_url   = "http://keycloak:8080/auth/realms/coddy/protocol/openid-connect/userinfo"
validate_url  = "http://keycloak:8080/auth/realms/coddy/protocol/openid-connect/userinfo"

http_address = "0.0.0.0:4180"
reverse_proxy = true
# Only used as an auth endpoint by Caddy; nothing is proxied through here.
upstreams = ["static://202"]

# Any realm user may log in. Identity = Keycloak username (users need no email;
# service accounts have none either).
email_domains = ["*"]
oidc_email_claim = "preferred_username"
insecure_oidc_allow_unverified_email = true

# Browser: go straight to Keycloak instead of showing a "Sign in with" page.
skip_provider_button = true

# Services: accept "Authorization: Bearer <Keycloak access token>" (JWT verified
# against the JWKS; audience must include coddy-web — see the audience mapper on
# client coddy-service in keycloak/import/realm-coddy.json).
skip_jwt_bearer_tokens = true

# What Caddy copies to the Coddy request (X-Auth-Request-User/-Email/-Preferred-Username).
set_xauthrequest = true
pass_user_headers = true
# Never forward Keycloak tokens onward; Caddy sets Coddy's own token.
pass_authorization_header = false
pass_access_token = false

# Session cookie (tokens are encrypted inside it).
cookie_name = "_coddy_oauth2"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "168h"
# Refresh the access token through Keycloak while the session is in use.
cookie_refresh = "5m"
# Login-in-progress (CSRF/PKCE state) cookie. One cookie per /oauth2/start so a
# second tab or a browser prefetch cannot overwrite the first one, and long
# enough for someone who leaves the login page open (Keycloak's own login
# timeout is 1h, see accessCodeLifespanLogin) or has to set a new password.
# With the 15m default the callback failed with "Unable to find a valid CSRF token".
cookie_csrf_per_request = true
cookie_csrf_expire = "2h"

silence_ping_logging = true
